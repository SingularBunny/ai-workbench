# The whole installer in a clean Debian container, public build, plugins downloaded from their
# repositories (tools/validate_in_docker.sh --clean --public): daily and on demand.
name: docker
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  install:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Exits non-zero when any check marker is red (RESULT line in the log).
      - run: bash tools/validate_in_docker.sh --clean --public
      - if: always()
        run: tail -n 200 dist/validate/debian-clean-public/install.log 2>/dev/null || ls -R dist/validate
